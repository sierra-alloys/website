<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="SIERRA ALLOYS Stock Search"
  >

  <meta
    name="theme-color"
    content="#f2f1ed"
  >

  <title>
    Stock Search | SIERRA ALLOYS
  </title>

  <link
    rel="stylesheet"
    href="stock.css"
  >
</head>


<body>

  <main class="stock-page">


    <!-- =====================================
         TOP
    ====================================== -->

    <section class="stock-container">

      <header class="stock-header">

        <div class="stock-title">

          <p class="stock-eyebrow">
            STOCK SEARCH
          </p>

          <h1>
            Find materials.
          </h1>

        </div>


        <div class="stock-count">

          <strong id="itemCount">
            0
          </strong>

          <span>
            ITEMS FOUND
          </span>

        </div>

      </header>



      <!-- =====================================
           SEARCH
      ====================================== -->

      <div class="search-box">

        <span class="search-icon">
          ⌕
        </span>

        <input
          type="search"
          id="stockSearch"
          placeholder="Search grade, type, size, specification..."
          autocomplete="off"
        >

      </div>



      <!-- =====================================
           FILTERS
      ====================================== -->

      <div class="filters">


        <!-- MATERIAL -->

        <div class="filter-group">

          <label for="materialFilter">
            MATERIAL
          </label>

          <select id="materialFilter">

            <option value="">
              ALL MATERIALS
            </option>

            <option value="SS304">
              SS304
            </option>

            <option value="SS316">
              SS316
            </option>

            <option value="S31803">
              DUPLEX S31803
            </option>

            <option value="S32205">
              DUPLEX S32205
            </option>

            <option value="S32750">
              SUPER DUPLEX S32750
            </option>

            <option value="S32760">
              SUPER DUPLEX S32760
            </option>

            <option value="TITANIUM">
              TITANIUM
            </option>

            <option value="NICKEL ALLOY">
              NICKEL ALLOY
            </option>

          </select>

        </div>



        <!-- PRODUCT -->

        <div class="filter-group">

          <label for="productFilter">
            PRODUCT
          </label>

          <select id="productFilter">

            <option value="">
              ALL PRODUCTS
            </option>

            <option value="PIPE">
              PIPE
            </option>

            <option value="FITTING">
              FITTING
            </option>

            <option value="FLANGE">
              FLANGE
            </option>

          </select>

        </div>



        <!-- TYPE -->

        <div class="filter-group">

          <label for="typeFilter">
            TYPE
          </label>

          <select id="typeFilter">

            <option value="">
              ALL TYPES
            </option>

          </select>

        </div>



        <!-- SIZE -->

        <div class="filter-group">

          <label for="sizeFilter">
            SIZE
          </label>

          <select id="sizeFilter">

            <option value="">
              ALL SIZES
            </option>

            <option value='1/2"'>1/2"</option>
            <option value='3/4"'>3/4"</option>
            <option value='1"'>1"</option>
            <option value='1-1/2"'>1-1/2"</option>
            <option value='2"'>2"</option>
            <option value='3"'>3"</option>
            <option value='4"'>4"</option>
            <option value='6"'>6"</option>
            <option value='8"'>8"</option>
            <option value='10"'>10"</option>
            <option value='12"'>12"</option>

          </select>

        </div>



        <!-- RATING -->

        <div class="filter-group">

          <label for="ratingFilter">
            RATING
          </label>

          <select id="ratingFilter">

            <option value="">
              ALL RATINGS
            </option>

            <option value="CL150">
              CL150
            </option>

            <option value="CL300">
              CL300
            </option>

            <option value="CL600">
              CL600
            </option>

            <option value="CL900">
              CL900
            </option>

            <option value="CL1500">
              CL1500
            </option>

            <option value="CL2500">
              CL2500
            </option>

          </select>

        </div>



        <!-- SCHEDULE -->

        <div class="filter-group">

          <label for="scheduleFilter">
            SCHEDULE
          </label>

          <select id="scheduleFilter">

            <option value="">
              ALL SCHEDULES
            </option>

            <option value="SCH 5S">
              SCH 5S
            </option>

            <option value="SCH 10S">
              SCH 10S
            </option>

            <option value="SCH 20">
              SCH 20
            </option>

            <option value="SCH 40">
              SCH 40
            </option>

            <option value="SCH 40S">
              SCH 40S
            </option>

            <option value="SCH 80">
              SCH 80
            </option>

            <option value="SCH 80S">
              SCH 80S
            </option>

            <option value="SCH 160">
              SCH 160
            </option>

            <option value="XXS">
              XXS
            </option>

          </select>

        </div>



        <!-- RESET -->

        <button
          class="reset-button"
          id="resetFilters"
          type="button"
        >
          RESET
        </button>

      </div>



      <!-- =====================================
           DESKTOP TABLE
      ====================================== -->

      <div class="stock-table-wrap">

        <table class="stock-table">

          <thead>

            <tr>

              <th>
                PRODUCT
              </th>

              <th>
                TYPE
              </th>

              <th>
                MATERIAL
              </th>

              <th>
                DESCRIPTION
              </th>

              <th>
                SIZE
              </th>

              <th>
                RATING
              </th>

              <th>
                SCHEDULE
              </th>

              <th>
                QTY
              </th>

              <th>
                STATUS
              </th>

            </tr>

          </thead>


          <tbody id="stockTableBody">
          </tbody>

        </table>

      </div>



      <!-- =====================================
           MOBILE RESULTS
      ====================================== -->

      <div
        class="stock-mobile"
        id="stockMobile"
      >
      </div>


      <!-- NO RESULT -->

      <div
        class="no-results"
        id="noResults"
      >

        No materials found.

      </div>


    </section>

  </main>


  <script src="stock.js"></script>

</body>

</html>
